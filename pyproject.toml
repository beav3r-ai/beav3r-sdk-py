[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beav3r-sdk"
version = "2.0.0"
description = "Python SDK for Beav3r approval and relay flows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Beav3r" }
]
dependencies = [
  "PyNaCl>=1.5.0",
]
keywords = ["beav3r", "approval", "sdk", "agent", "onchain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
onchain = ["pysha3>=1.0.2"]

[project.urls]
Homepage = "https://github.com/beav3r-ai/beav3r-sdk-py"
Source = "https://github.com/beav3r-ai/beav3r-sdk-py"
Issues = "https://github.com/beav3r-ai/beav3r-sdk-py/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
