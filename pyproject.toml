[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beav3r-sdk"
version = "2.0.0b5"
description = "Python SDK for Beav3r approval and relay flows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Beav3r" }
]
dependencies = [
  "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
onchain = ["pysha3>=1.0.2"]

[project.urls]
Homepage = "https://github.com/beav3r-ai/beav3r-sdk-py"
Source = "https://github.com/beav3r-ai/beav3r-sdk-py"
Issues = "https://github.com/beav3r-ai/beav3r-sdk-py/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
